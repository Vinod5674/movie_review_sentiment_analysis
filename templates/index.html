<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Movie Sentiment AI</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


<div class="container">


<h1>🎬 Movie Sentiment AI</h1>


<p class="subtitle">
Analyze movie reviews using NLP and Machine Learning
</p>



<form action="/predict" method="POST">


<textarea 
name="review"
placeholder="Write your movie review here..."
required></textarea>



<button type="submit">
🚀 Analyze Review
</button>


</form>




{% if prediction %}

<div class="result">

<h2>
{{prediction}}
</h2>


<p>
Confidence Score:
<strong>{{confidence}}%</strong>
</p>


<p>
Model: TF-IDF + Logistic Regression
</p>


</div>

{% endif %}



</div>


</body>

</html>
